services:
  mono-bdd:
    container_name: mono-bdd
    image: mariadb:latest
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: TOOR
      MARIADB_DATABASE: bddname
      MARIADB_USER: roger
      MARIADB_PASSWORD: regor
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--innodb_initialized']
      start_period: 5s
      interval: 10s
      timeout: 10s
      retries: 5
    
  mono-back:
    container_name: mono-back
    image: ${MONO_PROJECT_BACK}
    restart: always
    ports:
      - 12000:12000
    environment:
      BDD_HOST: mono-bdd
      BDD_PORT: 3306
    depends_on:
      mono_bdd:
        condition: service_healthy

  mono-front:
    container_name: mono-front
    image: ${MONO_PROJECT_FRONT}
    ports:
      - 80:80